<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX 실습 검수 도구</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#14171c;--ink2:#4c5260;--mute:#7b8190;--line:#e2e2dc;--acc:#1d4ed8;--acc-bg:#e8efff;
--ok:#16794a;--ok-bg:#e3f4ea;--part:#9a6400;--part-bg:#fdf1d8;--bad:#b42323;--bad-bg:#fbe5e5;--man:#5b4bb4;--man-bg:#ece9fb;--code:#f1f1ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1d2025;--ink:#eef0f3;--ink2:#b7bcc6;--mute:#8a909c;--line:#30343b;
--acc:#7aa2ff;--acc-bg:#1e2a45;--ok:#5fd39a;--ok-bg:#16322a;--part:#f0c26a;--part-bg:#3a2f16;--bad:#ff8a8a;--bad-bg:#3d1d1d;--man:#b3a6ff;--man-bg:#2a2545;--code:#262a31}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1d2025;--ink:#eef0f3;--ink2:#b7bcc6;--mute:#8a909c;--line:#30343b;
--acc:#7aa2ff;--acc-bg:#1e2a45;--ok:#5fd39a;--ok-bg:#16322a;--part:#f0c26a;--part-bg:#3a2f16;--bad:#ff8a8a;--bad-bg:#3d1d1d;--man:#b3a6ff;--man-bg:#2a2545;--code:#262a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'IBM Plex Sans KR','Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.hw{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:17px;margin:0}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:600}
.ok{background:var(--ok-bg);color:var(--ok)}.part{background:var(--part-bg);color:var(--part)}.bad{background:var(--bad-bg);color:var(--bad)}.man{background:var(--man-bg);color:var(--man)}.none{background:var(--code);color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}nav{max-height:220px;overflow:auto}}
nav{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.nv{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
.nv:hover{background:var(--code)}.nv[aria-current="true"]{background:var(--acc-bg)}
.nv .n{font-variant-numeric:tabular-nums;color:var(--mute);width:20px}.nv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.part{background:var(--part)}.dot.bad{background:var(--bad)}.dot.man{background:var(--man)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 4px}
.where{color:var(--ink2);font-size:13px}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)}
.kind{font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--code);color:var(--ink2);min-width:52px;text-align:center}
.fname{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;flex:1;min-width:180px;overflow-wrap:anywhere}
button.b{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--acc);color:var(--acc)}
button.b.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.exp{background:var(--code);border-radius:6px;padding:10px 12px;margin:10px 0}
textarea{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.verdict .b[aria-pressed="true"]{outline:2px solid currentColor}
input.memo{flex:1;min-width:200px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
pre{white-space:pre-wrap;background:var(--code);border-radius:6px;padding:12px;font-size:12.5px;max-height:360px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.hint{color:var(--mute);font-size:12.5px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><div class="hw">
  <h1>AX 실습 검수 도구</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="steps" aria-selected="true">단계별 검수</button>
    <button class="tab" role="tab" data-v="gpt" aria-selected="false">GPT에게 한 번에</button>
    <button class="tab" role="tab" data-v="report" aria-selected="false">결과 보고서</button>
  </div>
  <div class="sum" id="sum"></div>
</div></header>
<main>
  <div id="v-steps" class="grid"><nav id="nav" aria-label="단계"></nav><div id="step"></div></div>
  <div id="v-gpt" hidden></div>
  <div id="v-report" hidden></div>
</main>
<div class="toast" id="toast"></div>
<script>
const DATA=/*__DATA__*/null;
const KEY='ax-test-tool-v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let cur=+(st._cur||1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)};
function copy(text){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('복사했습니다'),()=>{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했습니다')}catch(e){toast('복사 실패 — 직접 선택해 주세요')}a.remove()})}
function download(name,b64,mime){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;a.click()}
const norm=s=>s.replace(/[−–—]/g,'-').replace(/\s+/g,' ');
function autoCheck(step,resp){
  const r=norm(resp||''),plain=r.replace(/,/g,'');
  return step.checks.map(tok=>{const neg=tok.startsWith('!'),t=norm(neg?tok.slice(1):tok);
    const hit=r.includes(t)||plain.includes(t.replace(/,/g,''));return {tok:t,neg,ok:neg?!hit:hit}});
}
const V={ok:'통과',part:'부분',bad:'실패',man:'수동 확인'};
function verdictOf(n){return (st[n]||{}).v||''}
function renderSum(){const c={ok:0,part:0,bad:0,man:0,none:0};DATA.steps.forEach(s=>c[verdictOf(s.n)||'none']++);
  document.getElementById('sum').innerHTML=Object.entries(V).map(([k,l])=>`<span class="chip ${k}">${l} ${c[k]}</span>`).join('')+`<span class="chip none">남음 ${c.none}</span>`}
function renderNav(){document.getElementById('nav').innerHTML=DATA.steps.map(s=>`<button class="nv" data-n="${s.n}" aria-current="${s.n===cur}"><span class="dot ${verdictOf(s.n)}"></span><span class="n">${s.n}</span><span class="t">${esc(s.title)}</span></button>`).join('')}
function renderStep(){
  const s=DATA.steps.find(x=>x.n===cur),my=st[s.n]||{};
  const items=s.items.map(([k,f])=>{const F=DATA.files[f],base=f.split('/').pop();
    const act=k==='첨부'?`<button class="b" data-dl="${esc(f)}">내려받기</button>`:`<button class="b pri" data-cp="${esc(f)}">복사</button><button class="b" data-show="${esc(f)}">보기</button>`;
    const how={지침:'에이전트 「지침」란에 전체 붙여넣기',첨부:'대화창에 첨부',보내기:'대화창에 붙여넣어 보내기'}[k];
    return `<div class="item"><span class="kind">${k}</span><span class="fname">${esc(base)}<br><span class="hint">${how}</span></span>${act}</div><pre hidden data-pre="${esc(f)}">${esc(F.text||'')}</pre>`}).join('');
  const ac=my.resp?autoCheck(s,my.resp):null;
  const chips=ac?ac.map(c=>`<span class="chip ${c.ok?'ok':'bad'}">${c.neg?'없어야 함: ':''}${esc(c.tok)} ${c.ok?'✓':'✗'}</span>`).join(''):'<span class="hint">응답을 붙여넣으면 기대 숫자 · 문구가 들어 있는지 자동으로 봅니다.</span>';
  const sug=ac?(ac.every(c=>c.ok)?'ok':ac.some(c=>c.ok)?'part':'bad'):'';
  document.getElementById('step').innerHTML=`<section class="card">
   <div class="where">${s.n} / ${DATA.steps.length} · 어디서: <b>${esc(s.where)}</b>${s.manual?' · <span class="chip man">사람이 화면에서 확인</span>':''}</div>
   <h2>${esc(s.title)}</h2>
   ${items||'<p class="hint">보낼 파일이 없는 확인 단계입니다. 앞 단계의 응답이나 생성된 화면을 보고 판정합니다.</p>'}
   <div class="exp"><b>기대 결과</b><br>${esc(s.expect)}</div>
   <label for="resp"><b>GPT 응답 붙여넣기</b> <span class="hint">(${s.manual?'선택 — 화면에서 본 숫자를 적어도 됩니다':'응답 전체'})</span></label>
   <textarea id="resp" placeholder="여기에 GPT 응답을 붙여넣으세요">${esc(my.resp||'')}</textarea>
   <div class="checks">${chips}</div>
   <div class="verdict">판정 ${sug?`<span class="hint">(자동 제안: ${V[sug]})</span>`:''}
     ${Object.entries(V).map(([k,l])=>`<button class="b ${k}" data-v="${k}" aria-pressed="${my.v===k}">${l}</button>`).join('')}
     <input class="memo" id="memo" placeholder="메모 — 다른 점 · 고칠 곳" value="${esc(my.memo||'')}">
   </div>
   <div class="verdict" style="justify-content:space-between;margin-top:14px">
     <button class="b" data-go="-1" ${cur===1?'disabled':''}>← 이전</button>
     <button class="b pri" data-go="1" ${cur===DATA.steps.length?'disabled':''}>다음 →</button>
   </div></section>`;
}
function renderGpt(){document.getElementById('v-gpt').innerHTML=`<section class="card">
  <h2>GPT에게 한 번에 시키기</h2>
  <p>ChatGPT 새 채팅 · 추론 강도 <b>높음</b> · <b>데이터 분석</b> 켜기(22번까지 보려면 웹 검색도). 아래 두 파일을 첨부하고 프롬프트를 붙여넣습니다. GPT는 에이전트를 직접 만들지 못해 지침을 대신 따라 해 보는 방식이고, 화면 조작이 필요한 줄은 '수동 확인'으로 남습니다.</p>
  <div class="item"><span class="kind">첨부</span><span class="fname">AX_실습파일.zip</span><button class="b" id="dlzip">내려받기</button></div>
  <div class="item"><span class="kind">첨부</span><span class="fname">GPT_테스트_체크리스트.md</span><button class="b" id="dlck">내려받기</button></div>
  <div class="item"><span class="kind">보내기</span><span class="fname">테스트 실행 프롬프트</span><button class="b pri" id="cpall">복사</button></div>
  <pre>${esc(DATA.gptAll)}</pre>
  <p class="hint">GPT가 낸 판정 표를 받으면 '단계별 검수' 탭에서 줄마다 응답을 붙여넣고 판정을 확정하면 보고서에 모입니다.</p></section>`;
  document.getElementById('dlzip').onclick=()=>download('AX_실습파일.zip',DATA.zip,'application/zip');
  document.getElementById('dlck').onclick=()=>downloadText('GPT_테스트_체크리스트.md',DATA.checkMd);
  document.getElementById('cpall').onclick=()=>copy(DATA.gptAll);}
function reportMd(){const d=new Date().toISOString().slice(0,10);
  let m=`# AX 실습 검수 결과 · ${d}\n\n| # | 단계 | 기대 결과 | 판정 | 자동 대조 | 메모 |\n|---|---|---|---|---|---|\n`;
  DATA.steps.forEach(s=>{const my=st[s.n]||{},ac=my.resp?autoCheck(s,my.resp):null;
    m+=`| ${s.n} | ${s.title} | ${s.expect.replace(/\|/g,'/')} | ${V[my.v]||'—'} | ${ac?ac.filter(c=>c.ok).length+'/'+ac.length:'—'} | ${(my.memo||'').replace(/\|/g,'/')} |\n`});
  const c={ok:0,part:0,bad:0,man:0};DATA.steps.forEach(s=>{const v=verdictOf(s.n);if(v)c[v]++});
  return m+`\n통과 ${c.ok} · 부분 ${c.part} · 실패 ${c.bad} · 수동 확인 ${c.man} · 남음 ${DATA.steps.length-c.ok-c.part-c.bad-c.man}\n`}
function renderReport(){const md=reportMd();document.getElementById('v-report').innerHTML=`<section class="card"><h2>결과 보고서</h2>
  <div class="verdict"><button class="b pri" id="cprep">복사</button><button class="b" id="dlrep">.md로 내려받기</button><button class="b" id="reset">처음부터 다시</button></div>
  <table><thead><tr><th>#</th><th>단계</th><th>판정</th><th>메모</th></tr></thead><tbody>${DATA.steps.map(s=>{const my=st[s.n]||{};return `<tr><td>${s.n}</td><td>${esc(s.title)}</td><td><span class="chip ${my.v||'none'}">${V[my.v]||'—'}</span></td><td>${esc(my.memo||'')}</td></tr>`}).join('')}</tbody></table>
  <pre>${esc(md)}</pre></section>`;
  document.getElementById('cprep').onclick=()=>copy(md);document.getElementById('dlrep').onclick=()=>downloadText('AX_실습검수결과.md',md);
  document.getElementById('reset').onclick=()=>{if(confirm('입력한 응답 · 판정을 모두 지울까요?')){st={};save();cur=1;all()}}}
function all(){renderSum();renderNav();renderStep();renderGpt();renderReport()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){cur=+b.dataset.n;st._cur=cur;save();renderNav();renderStep();window.scrollTo(0,0)}
  else if(b.dataset.go){cur=Math.min(DATA.steps.length,Math.max(1,cur+ +b.dataset.go));st._cur=cur;save();renderNav();renderStep();window.scrollTo(0,0)}
  else if(b.dataset.cp)copy(DATA.files[b.dataset.cp].text);
  else if(b.dataset.show){const p=document.querySelector(`[data-pre="${CSS.escape(b.dataset.show)}"]`);p.hidden=!p.hidden}
  else if(b.dataset.dl){const f=DATA.files[b.dataset.dl];download(b.dataset.dl.split('/').pop(),f.b64,f.mime)}
  else if(b.dataset.v&&b.classList.contains('b')){const n=cur;st[n]=Object.assign(st[n]||{},{v:b.dataset.v});save();renderSum();renderNav();renderStep();renderReport()}
  else if(b.classList.contains('tab')){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t===b));['steps','gpt','report'].forEach(v=>document.getElementById('v-'+v).hidden=v!==b.dataset.v);if(b.dataset.v==='report')renderReport()}});
document.addEventListener('input',e=>{if(e.target.id==='resp'){st[cur]=Object.assign(st[cur]||{},{resp:e.target.value});save();
    const s=DATA.steps.find(x=>x.n===cur),ac=autoCheck(s,e.target.value);document.querySelector('.checks').innerHTML=ac.map(c=>`<span class="chip ${c.ok?'ok':'bad'}">${c.neg?'없어야 함: ':''}${esc(c.tok)} ${c.ok?'✓':'✗'}</span>`).join('')}
  if(e.target.id==='memo'){st[cur]=Object.assign(st[cur]||{},{memo:e.target.value});save()}});
all();
</script>
</body>
</html>
